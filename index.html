<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>VirtualMOS</title>
  <meta name="description" content="VirtualMOS: MehburOS temalı, tarayıcıda çalışan sanal masaüstü. Yakında.">
  <meta name="theme-color" content="#05090C">
  <link rel="icon" type="image/png" href="assets/brand/mehburos-icon-32.png">
  <style>
    /* Geçici "yakında" sayfası — Faz 1'de gerçek uygulamayla değişecek */
    :root {
      --bg: #05090C;
      --panel: #0E161B;
      --cyan: #2DE2F5;
      --cyan-soft: #8AF3FF;
      --text: #E6FCFF;
      --muted: #8FA9B0;
    }
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      min-height: 100%;
      display: grid;
      place-items: center;
      padding: 24px 16px;
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 60% 45% at 50% 40%, rgba(45, 226, 245, .14), transparent 70%),
        linear-gradient(rgba(45, 226, 245, .05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(45, 226, 245, .05) 1px, transparent 1px);
      background-size: auto, 40px 40px, 40px 40px;
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
      text-align: center;
    }
    main { max-width: 560px; display: flex; flex-direction: column; align-items: center; gap: 18px; }
    .logo {
      width: 140px; height: 140px; border-radius: 30px;
      box-shadow: 0 0 40px rgba(45, 226, 245, .35), 0 0 0 1px rgba(45, 226, 245, .25);
      animation: glow 3s ease-in-out infinite;
    }
    @keyframes glow { 50% { box-shadow: 0 0 70px rgba(45, 226, 245, .55), 0 0 0 1px rgba(45, 226, 245, .4); } }
    h1 {
      font-size: clamp(40px, 9vw, 64px); font-weight: 700; letter-spacing: .02em;
      color: var(--cyan-soft);
      text-shadow: 0 0 8px var(--cyan), 0 0 28px rgba(45, 226, 245, .6);
    }
    .badge {
      padding: 6px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
      color: var(--cyan); border: 1px solid rgba(45, 226, 245, .5); background: rgba(45, 226, 245, .08);
    }
    p { color: var(--muted); line-height: 1.6; font-size: 16px; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
    a.btn, button.btn {
      font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; text-decoration: none;
      padding: 10px 18px; border-radius: 10px; border: 1px solid rgba(45, 226, 245, .45);
      color: var(--text); background: var(--panel); transition: background .2s, box-shadow .2s;
    }
    a.btn.primary { background: var(--cyan); color: var(--bg); border-color: var(--cyan); }
    a.btn:hover, button.btn:hover { box-shadow: 0 0 18px rgba(45, 226, 245, .4); }
    a.btn:focus-visible, button.btn:focus-visible { outline: 2px solid var(--cyan-soft); outline-offset: 3px; }
    footer { margin-top: 18px; font-size: 12px; color: var(--muted); opacity: .8; }
    @media (prefers-reduced-motion: reduce) { .logo { animation: none; } }
  </style>
</head>
<body>
  <main>
    <img class="logo" src="assets/brand/mehburos-icon-256.png" alt="MehburOS logosu" width="140" height="140">
    <span class="badge" data-i18n="badge">Yakında</span>
    <h1>VirtualMOS</h1>
    <p data-i18n="text">MehburOS temalı, tarayıcıda çalışan sanal masaüstü. Pencereler, dosyalar, uygulamalar ve MehburMC Launcher — kurulum gerektirmeden bilgisayarda, tablette ve telefonda.</p>
    <div class="actions">
      <a class="btn primary" href="https://github.com/virtualmos/virtualmos.github.io/blob/main/docs/yol-haritasi.md" target="_blank" rel="noopener" data-i18n="roadmap">Yol haritası</a>
      <a class="btn" href="https://mehbur07.github.io/" target="_blank" rel="noopener" data-i18n="other">Diğer projeler</a>
      <button class="btn" type="button" id="lang" aria-label="Switch to English">EN</button>
    </div>
    <footer>© 2026 Mehbur07</footer>
  </main>
  <script>
    // Basit TR/EN geçişi; seçim tarayıcıda hatırlanır
    const T = {
      tr: { badge: 'Yakında', text: 'MehburOS temalı, tarayıcıda çalışan sanal masaüstü. Pencereler, dosyalar, uygulamalar ve MehburMC Launcher — kurulum gerektirmeden bilgisayarda, tablette ve telefonda.', roadmap: 'Yol haritası', other: 'Diğer projeler' },
      en: { badge: 'Coming soon', text: 'A MehburOS-themed virtual desktop that runs in your browser. Windows, files, apps and the MehburMC Launcher — no installation, on computers, tablets and phones.', roadmap: 'Roadmap', other: 'Other projects' }
    };
    const btn = document.getElementById('lang');
    function setLang(l) {
      document.documentElement.lang = l;
      document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = T[l][el.dataset.i18n]; });
      btn.textContent = l === 'tr' ? 'EN' : 'TR';
      btn.setAttribute('aria-label', l === 'tr' ? 'Switch to English' : 'Türkçeye geç');
      try { localStorage.setItem('vmos:lang', l); } catch (e) { /* depolama kapalıysa sorun değil */ }
    }
    let saved = null;
    try { saved = localStorage.getItem('vmos:lang'); } catch (e) { /* yok say */ }
    const browserLang = (navigator.language || 'tr').toLowerCase().startsWith('tr') ? 'tr' : 'en';
    setLang(saved === 'tr' || saved === 'en' ? saved : browserLang);
    btn.addEventListener('click', () => setLang(document.documentElement.lang === 'tr' ? 'en' : 'tr'));
  </script>
</body>
</html>
