<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sayfa bulunamadı — VirtualMOS</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#05090C">
  <link rel="icon" type="image/png" href="/assets/brand/mehburos-icon-32.png">
  <style>
    /* Geçici 404 sayfası — Faz 1'de yeni tasarımla değişecek */
    * { box-sizing: border-box; margin: 0; }
    html, body { height: 100%; }
    body {
      display: grid; place-items: center; padding: 24px 16px; text-align: center;
      background: #05090C radial-gradient(ellipse 60% 45% at 50% 40%, rgba(45, 226, 245, .12), transparent 70%);
      color: #E6FCFF; font-family: system-ui, -apple-system, "Segoe UI", Roboto, Ubuntu, sans-serif;
    }
    main { display: flex; flex-direction: column; align-items: center; gap: 16px; max-width: 480px; }
    .code { font-size: clamp(72px, 18vw, 120px); font-weight: 800; color: #8AF3FF; text-shadow: 0 0 10px #2DE2F5, 0 0 40px rgba(45, 226, 245, .6); line-height: 1; }
    p { color: #8FA9B0; line-height: 1.6; }
    a { padding: 10px 18px; border-radius: 10px; background: #2DE2F5; color: #05090C; font-weight: 600; text-decoration: none; }
    a:focus-visible { outline: 2px solid #8AF3FF; outline-offset: 3px; }
  </style>
</head>
<body>
  <main>
    <div class="code">404</div>
    <h1>Sayfa bulunamadı</h1>
    <p>Aradığın sayfa yok. / This page doesn't exist.</p>
    <a href="/">VirtualMOS</a>
  </main>
</body>
</html>
